project_id = "genshinflex"

[auth]
enabled = true
site_url = "https://genshinflex.com"
additional_redirect_urls = [
  "https://genshinflex.com/**",
  "https://test.genshinflex.pages.dev/**",
  "http://localhost:4321/**"
]

# Включить после настройки секрета Turnstile в Supabase.
[auth.captcha]
enabled = false
provider = "turnstile"
secret = "env(TURNSTILE_SECRET)"

[auth.email]
enable_signup = true
enable_confirmations = true

[auth.email.smtp]
enabled = true
host = "env(SMTP_HOST)"
port = 465
user = "env(SMTP_USER)"
pass = "env(SMTP_PASS)"
admin_email = "env(SMTP_ADMIN_EMAIL)"
sender_name = "GenshinFlex"

[auth.external.discord]
enabled = true
client_id = "env(DISCORD_CLIENT_ID)"
secret = "env(DISCORD_CLIENT_SECRET)"

[auth.external.google]
enabled = true
client_id = "env(GOOGLE_CLIENT_ID)"
secret = "env(GOOGLE_CLIENT_SECRET)"
